[project]
name = "kaggle-titanic"
version = "0.1.0"
description = "Kaggle Titanic: Machine Learning from Disaster"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "kaggle>=1.6",
    "omegaconf>=2.4.0",
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "xgboost>=3.2.0",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
