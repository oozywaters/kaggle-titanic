seed: 42
data_dir: data
submission_path: submissions/${model}_submission.csv

cv:
  n_folds: 5

model: catboost

params:
  logreg:
    max_iter: 2000
  ridge:
    alpha: 1.0
  lasso_logreg:
    l1_ratio: 1.0
    solver: saga
    max_iter: 5000
  elasticnet_logreg:
    l1_ratio: 0.5
    solver: saga
    max_iter: 5000
  knn:
    n_neighbors: 5
  decision_tree:
    max_depth: 5
    random_state: 42
  random_forest:
    n_estimators: 300
    random_state: 42
  catboost:
    iterations: 500
    verbose: 0
    allow_writing_files: false
    random_state: 42
  lightgbm:
    n_estimators: 300
    verbose: -1
    random_state: 42
  xgboost:
    n_estimators: 300
    random_state: 42
