seed: 42
data_dir: data
submission_path: submissions/${model}_submission.csv

cv:
  n_folds: 5

model: catboost

ensemble:
  estimators: [logreg, random_forest, catboost, lightgbm, xgboost]
  stacking_cv: 5

params:
  logreg:
    max_iter: 2000
  ridge:
    alpha: 1.0
  lasso_logreg:
    penalty: elasticnet
    l1_ratio: 1.0
    solver: saga
    max_iter: 5000
  elasticnet_logreg:
    penalty: elasticnet
    l1_ratio: 0.5
    solver: saga
    max_iter: 5000
  knn:
    n_neighbors: 5
  decision_tree:
    max_depth: 5
    random_state: ${seed}
  random_forest:
    n_estimators: 300
    random_state: ${seed}
  catboost:
    iterations: 500
    verbose: 0
    allow_writing_files: false
    random_state: ${seed}
  lightgbm:
    n_estimators: 300
    verbose: -1
    random_state: ${seed}
  xgboost:
    n_estimators: 300
    random_state: ${seed}
  mlp:
    hidden: [64, 32]
    activation: relu
    batchnorm: true
    dropout: 0.2
    optimizer: adam
    lr: 0.001
    weight_decay: 0.0
    scheduler: none
    epochs: 60
    batch_size: 64
    random_state: ${seed}
